version: '3'

silent: true
method: none

tasks:

  default:
    desc: 'List libraries you can build right now (runs the todo task).'
    cmds:
      - task: todo

  changes:version:
    desc: 'Preview the next 0.x.y from the current tag and pending .changes/new files.'
    env:
      REPO_TODO_MODE: "{{.TODO_MODE}}"
      REPO_CLI_ARGS: "{{.CLI_ARGS}}"
    cmds:
      - sh .repo/scrupts/tasks.sh changes:version
  release:prepare:
    desc: 'Apply pending .changes to CHANGELOG.md and print new=vX.Y.Z (or none).'
    cmds:
      - sh .github/scripts/release-prepare.sh

  todo:
    desc: 'List libraries ready to build now (status todo, deps done, mojoNeeds have). `task todo -- --all` adds reasons.'
    env:
      REPO_TODO_MODE: "{{.TODO_MODE}}"
      REPO_CLI_ARGS: "{{.CLI_ARGS}}"
    cmds:
      - sh .repo/scrupts/tasks.sh todo
  todo-all:
    desc: 'Like `task todo`, but show every dependency-clear todo library with its blocking reason.'
    cmds:
      - task: todo
        vars: { TODO_MODE: all }

  mojoHave:
    desc: 'List the mojo.yml capability keys whose state is have.'
    env:
      REPO_TODO_MODE: "{{.TODO_MODE}}"
      REPO_CLI_ARGS: "{{.CLI_ARGS}}"
    cmds:
      - sh .repo/scrupts/tasks.sh mojoHave
  current:
    desc: 'List libraries that are in progress (status current).'
    env:
      REPO_TODO_MODE: "{{.TODO_MODE}}"
      REPO_CLI_ARGS: "{{.CLI_ARGS}}"
    cmds:
      - sh .repo/scrupts/tasks.sh current
  all:
    desc: 'List every catalogued library as: id  status  name (sorted by id).'
    env:
      REPO_TODO_MODE: "{{.TODO_MODE}}"
      REPO_CLI_ARGS: "{{.CLI_ARGS}}"
    cmds:
      - sh .repo/scrupts/tasks.sh all
  count:
    desc: 'Count libraries per status, plus the total.'
    env:
      REPO_TODO_MODE: "{{.TODO_MODE}}"
      REPO_CLI_ARGS: "{{.CLI_ARGS}}"
    cmds:
      - sh .repo/scrupts/tasks.sh count
  waiting:
    desc: 'List libraries waiting for a dependency and name the missing ones.'
    env:
      REPO_TODO_MODE: "{{.TODO_MODE}}"
      REPO_CLI_ARGS: "{{.CLI_ARGS}}"
    cmds:
      - sh .repo/scrupts/tasks.sh waiting
  show:
    desc: 'Print one catalogue file: task show -- <id>'
    env:
      REPO_TODO_MODE: "{{.TODO_MODE}}"
      REPO_CLI_ARGS: "{{.CLI_ARGS}}"
    cmds:
      - sh .repo/scrupts/tasks.sh show
  test:
    desc: 'Full library test pool (alias for test::full).'
    cmds:
      - task: test::full

  test::full:
    desc: 'Test every discovered library; JOBS defaults to 2.'
    env:
      REPO_TEST_JOBS: '{{.JOBS | default "2"}}'
    cmds:
      - python3 .repo/scrupts/testing.py run test full

  test::smart:
    desc: 'Test changes since the last full-checked release tag and their users.'
    env:
      REPO_TEST_JOBS: '{{.JOBS | default "2"}}'
    cmds:
      - python3 .repo/scrupts/testing.py run test smart

  test::plan:
    desc: 'Show the smart baseline, selection and reasons without running tests.'
    cmds:
      - python3 .repo/scrupts/testing.py plan

  '*::test':
    desc: 'Test one library: task net_ip::test (no registration).'
    env:
      REPO_TEST_LIB: '{{index .MATCH 0}}'
    cmds:
      - python3 .repo/scrupts/testing.py single "$REPO_TEST_LIB" test

  '*::compile':
    desc: 'Compile one library: task net_ip::compile.'
    env:
      REPO_TEST_LIB: '{{index .MATCH 0}}'
    cmds:
      - python3 .repo/scrupts/testing.py single "$REPO_TEST_LIB" compile

  '*::ci':
    desc: 'Check one library: task net_ip::ci (CI task or test fallback).'
    env:
      REPO_TEST_LIB: '{{index .MATCH 0}}'
    cmds:
      - python3 .repo/scrupts/testing.py single "$REPO_TEST_LIB" ci

  testing:check:
    desc: 'Check smart selection and dispatch using isolated Git repositories.'
    cmds:
      - python3 .repo/scrupts/test_testing.py
  missingMojo:
    desc: 'List MissingMojo markers older than the installed Mojo (use -- all for every marker).'
    env:
      REPO_TODO_MODE: "{{.TODO_MODE}}"
      REPO_CLI_ARGS: "{{.CLI_ARGS}}"
    cmds:
      - sh .repo/scrupts/tasks.sh missingMojo
  namespace:test:
    desc: 'Check akku consumer imports and reject the removed namespace.'
    dir: '{{.TASKFILE_DIR}}'
    cmds:
      - sh .github/tests/check_namespace.sh

  ci:
    desc: 'Full CI (alias for ci::full); main explicitly calls ci::full.'
    cmds:
      - task: ci::full

  ci::full:
    desc: 'All library CI suites and repository gates; required before tagging.'
    env:
      REPO_TEST_JOBS: '{{.JOBS | default "2"}}'
    cmds:
      - task: testing:check
      - task: namespace:test
      - python3 .repo/scrupts/testing.py run ci full
      - task: missingMojo:check

  ci::smart:
    desc: 'Changed libraries and their users, with mandatory repository gates.'
    env:
      REPO_TEST_JOBS: '{{.JOBS | default "2"}}'
    cmds:
      - task: testing:check
      - task: namespace:test
      - python3 .repo/scrupts/testing.py run ci smart
      - task: missingMojo:check

  missingMojo:check:
    internal: true
    env:
      REPO_CLI_ARGS: check
    cmds:
      - sh .repo/scrupts/tasks.sh missingMojo
