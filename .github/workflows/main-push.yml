name: main-push

# Every main revision is fully checked on both supported CI platforms.
# Only the same checked revision may be released; a newer push has its own run.
on:
  push:
    branches: [main]

concurrency:
  group: main-push
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            system: Linux
            arch: x86_64
          - runner: macos-15
            system: Darwin
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Verify platform
        run: |
          test "$(uname -s)" = "${{ matrix.system }}"
          test "$(uname -m)" = "${{ matrix.arch }}"
          uname -sm

      - name: Provide timeout on macOS
        if: runner.os == 'macOS'
        run: |
          brew install coreutils
          echo "$(brew --prefix coreutils)/libexec/gnubin" >> "$GITHUB_PATH"

      - name: Install pixi
        uses: prefix-dev/setup-pixi@v0.10.2
        with:
          pixi-version: latest
          run-install: false

      - name: Install the toolchain
        run: pixi install --locked

      - name: Full check
        run: pixi run --locked task ci::full

  release:
    needs: check
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Install pixi
        uses: prefix-dev/setup-pixi@v0.10.2
        with:
          pixi-version: latest
          run-install: false

      - name: Install the toolchain
        run: pixi install --locked

      - name: Release the checked revision
        run: |
          set -eu
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          checked=$(git rev-parse HEAD)
          git fetch origin main --tags
          if [ "$(git rev-parse origin/main)" != "$checked" ]; then
            echo "main advanced; its own two-platform run must release it"
            exit 0
          fi

          latest=$(git for-each-ref --format='%(refname:short)' --sort=-version:refname 'refs/tags/v[0-9]*.[0-9]*.[0-9]*' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -n 1 || true)
          if [ -n "$latest" ] && ! git merge-base --is-ancestor "$latest" HEAD; then
            echo "error: latest published tag $latest is not an ancestor of main" >&2
            exit 1
          fi

          out=$(sh .github/scripts/release-prepare.sh)
          echo "$out"
          new=$(printf '%s\n' "$out" | grep '^new=' | cut -d= -f2)
          if [ "$new" = "none" ]; then
            echo "no releasable pending changes"
            exit 0
          fi
          if [ -z "$new" ]; then
            echo "error: release-prepare.sh did not report a version" >&2
            exit 1
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/$new" >/dev/null 2>&1; then
            echo "error: release tag already exists: $new" >&2
            exit 1
          fi

          pixi run --locked python3 .repo/scrupts/testing.py release-guard "$checked"
          git add -A
          git commit -m "release: $new [skip ci]"
          git tag -a "$new" -m "Full CI: linux-64 osx-arm64"
          if git push --atomic origin HEAD:main "$new"; then
            echo "released $new after Linux x86-64 and macOS ARM64 full checks"
          else
            echo "error: release push rejected; never substitute an unchecked revision" >&2
            exit 1
          fi
